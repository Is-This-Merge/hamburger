<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>햄버거 쌓기 게임</title>

<style>
body{
    text-align:center;
    font-family:Arial,sans-serif;
    background:#fff3d6;
}

#game{
    width:550px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:20px;
    border:3px solid #333;
}

.topInfo{
    display:flex;
    justify-content:space-around;
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
}

#timer{
    color:red;
}

#order{
    border:2px dashed gray;
    padding:10px;
    min-height:40px;
    margin-bottom:20px;
    font-size:18px;
}

#burgerArea{
    height:350px;
    width:300px;
    margin:auto;
    display:flex;
    flex-direction:column-reverse;
    align-items:center;
    border:3px solid black;
    border-radius:20px;
    background:linear-gradient(#d4ecff,#ffffff);
    padding-bottom:20px;
}

.ingredient{
    margin-top:-5px;
}

.bread{
    width:240px;
    height:50px;
    border-radius:50px 50px 20px 20px;
    background:linear-gradient(#f0c76a,#d89239);
    border:3px solid #8b5a2b;
}

.bread::before{
    content:"";
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    top:10px;
    left:30px;

    box-shadow:
    25px 5px white,
    55px -2px white,
    90px 7px white,
    130px 0px white,
    170px 4px white;
}

.patty{
    width:220px;
    height:35px;
    border-radius:20px;
    background:linear-gradient(#633014,#3d1c0c);
}

.cheese{
    width:250px;
    height:20px;
    background:gold;

    clip-path:polygon(
        0 0,
        100% 0,
        100% 50%,
        85% 100%,
        70% 50%,
        55% 100%,
        40% 50%,
        25% 100%,
        0 50%
    );
}

.lettuce{
    width:230px;
    height:25px;
    border-radius:50%;
    background:#4caf50;
}

.tomato{
    width:200px;
    height:18px;
    border-radius:20px;
    background:#e53935;
}

button{
    padding:12px 18px;
    margin:5px;
    font-size:16px;

    border:none;
    border-radius:12px;

    background:#ffb74d;
    color:white;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

button:hover{
    background:#ff9800;
    transform:scale(1.05);
}

button:active{
    transform:scale(0.95);
}

button:disabled{
    background:#d3d3d3;
    color:#888;
    cursor:not-allowed;
    transform:none;
}

.startBtn{
    background:#4caf50;
}

.startBtn:hover{
    background:#388e3c;
}

.restartBtn{
    background:#e53935;
}

.restartBtn:hover{
    background:#c62828;
}

#message{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}
</style>
</head>

<body>
<a href="./index.html"> 메인 페이지로</a>
<a href="./hamburger2.html"> 다른 햄버거 게임으로 넘어가기</a>
<h1>🍔 햄버거 쌓기 게임</h1>

<div id="game">

<div class="topInfo">
<div id="score">점수: 0</div>
<div id="timer">⏱️ 30초</div>
</div>

<h3>주문서</h3>
<div id="order"></div>

<h3>내 햄버거</h3>
<div id="burgerArea"></div>

<h3>게임</h3>

<button class="startBtn"
onclick="startGame()">
▶ 게임 시작
</button>

<button class="restartBtn"
onclick="restartGame()">
🔄 다시 시작
</button>

<br><br>

<button class="ingredientBtn"
onclick="addIngredient('bread')">
🍞 빵
</button>

<button class="ingredientBtn"
onclick="addIngredient('lettuce')">
🥬 상추
</button>

<button class="ingredientBtn"
onclick="addIngredient('cheese')">
🧀 치즈
</button>

<button class="ingredientBtn"
onclick="addIngredient('patty')">
🥩 패티
</button>

<button class="ingredientBtn"
onclick="addIngredient('tomato')">
🍅 토마토
</button>

<br><br>

<button onclick="resetStack()">
초기화
</button>

<button onclick="checkBurger()">
제출
</button>

<div id="message"></div>

</div>

<script>

const ingredientNames={
bread:"빵",
lettuce:"상추",
cheese:"치즈",
patty:"패티",
tomato:"토마토"
};

const ingredients=[
"lettuce",
"cheese",
"patty",
"tomato"
];

let score=0;
let timeLeft=30;
let timer=null;

let gameStarted=false;
let gameEnded=false;

let order=[];
let playerStack=[];

const scoreDiv=document.getElementById("score");
const timerDiv=document.getElementById("timer");
const orderDiv=document.getElementById("order");
const burgerArea=document.getElementById("burgerArea");
const messageDiv=document.getElementById("message");

const ingredientButtons=
document.querySelectorAll(".ingredientBtn");

disableButtons();

function disableButtons(){
    ingredientButtons.forEach(
    btn=>btn.disabled=true
    );
}

function enableButtons(){
    ingredientButtons.forEach(
    btn=>btn.disabled=false
    );
}

function startGame(){

if(gameStarted)return;

gameStarted=true;
gameEnded=false;

enableButtons();

createOrder();

startTimer();

messageDiv.innerText=
"게임 시작!";
}

function restartGame(){

clearInterval(timer);

score=0;
timeLeft=30;

gameStarted=false;
gameEnded=false;

playerStack=[];
order=[];

burgerArea.innerHTML="";
orderDiv.innerHTML="";

scoreDiv.innerText=
"점수: 0";

timerDiv.innerText=
"⏱️ 30초";

messageDiv.innerText=
"초기화 완료";

disableButtons();
}

function createOrder(){

order=["bread"];

let count=
Math.floor(Math.random()*3)+3;

for(let i=0;i<count;i++){

order.push(
ingredients[
Math.floor(
Math.random()*ingredients.length
)
]
);

}

order.push("bread");

playerStack=[];

updateScreen();
}

function updateScreen(){

scoreDiv.innerText=
"점수: "+score;

timerDiv.innerText=
"⏱️ "+timeLeft+"초";

orderDiv.innerText=
order.map(
x=>ingredientNames[x]
).join(" → ");

burgerArea.innerHTML="";

for(let item of playerStack){

let div=
document.createElement("div");

div.className=
"ingredient "+item;

burgerArea.appendChild(div);
}
}

function addIngredient(item){

if(!gameStarted||gameEnded)return;

playerStack.push(item);

let index=
playerStack.length-1;

if(playerStack[index]!=order[index]){

score-=20;

if(score<0){
score=0;
}

messageDiv.innerText=
"틀림! -20점";

messageDiv.style.color="red";
}
else{

messageDiv.innerText=
"좋아!";

messageDiv.style.color="green";
}

updateScreen();
}

function resetStack(){

playerStack=[];

score-=10;

if(score<0){
score=0;
}

messageDiv.innerText=
"초기화 -10점";

updateScreen();
}

function checkBurger(){

if(JSON.stringify(playerStack)
==
JSON.stringify(order)){

let gained=
100+timeLeft*5;

score+=gained;

timeLeft=30;

messageDiv.innerText=
"성공! +"+gained+"점";

messageDiv.style.color=
"green";

createOrder();

}
else{

messageDiv.innerText=
"실패";

messageDiv.style.color=
"red";

}

updateScreen();
}

function startTimer(){

timer=setInterval(()=>{

if(gameEnded)return;

timeLeft--;

if(timeLeft<=0){

gameEnded=true;

disableButtons();

clearInterval(timer);

messageDiv.innerText=
"게임 종료!";
}

updateScreen();

},1000);

}

</script>

</body>
</html>
